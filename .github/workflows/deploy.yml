name: Deploy Backend to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to cPanel Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Backend Code
        run: |
          node --check server.js

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT || 22 }} -H ${{ secrets.CPANEL_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync Files to cPanel
        run: |
          rsync -avz \
            -e "ssh -p ${{ secrets.CPANEL_SSH_PORT || 22 }} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='node_modules' \
            --exclude='.env' \
            ./ ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:${{ secrets.CPANEL_BACKEND_PATH }}/

      - name: Install Dependencies & Restart Node App on cPanel
        run: |
          ssh -p ${{ secrets.CPANEL_SSH_PORT || 22 }} -o StrictHostKeyChecking=no ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} "
            cd ${{ secrets.CPANEL_BACKEND_PATH }}
            npm install --omit=dev --no-audit --prefer-offline || npm install --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt
            if command -v pm2 > /dev/null 2>&1; then
              pm2 reload factory-backend || pm2 restart factory-backend || true
            fi
          "
