name: Deploy Backend to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to cPanel Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Backend Code
        run: |
          node --check server.js

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PORT_RAW: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_HOST_RAW: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER_RAW: ${{ secrets.CPANEL_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          SSH_HOST=$(echo -n "$SSH_HOST_RAW" | tr -d '\r\n ')
          SSH_USER=$(echo -n "$SSH_USER_RAW" | tr -d '\r\n ')
          SSH_PORT=$(echo -n "$SSH_PORT_RAW" | tr -d '\r\n ')
          SSH_PORT=${SSH_PORT:-22}
          
          cat << EOF > ~/.ssh/config
          Host cpanel
              HostName ${SSH_HOST}
              User ${SSH_USER}
              Port ${SSH_PORT}
              IdentityFile ~/.ssh/id_rsa
              IdentitiesOnly yes
              StrictHostKeyChecking no
              PubkeyAcceptedKeyTypes +ssh-rsa
              HostKeyAlgorithms +ssh-rsa
              ServerAliveInterval 30
              ServerAliveCountMax 3
              ControlMaster auto
              ControlPath ~/.ssh/control-%h-%p-%r
              ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Package & Transfer to cPanel
        env:
          DEST_PATH_RAW: ${{ secrets.CPANEL_BACKEND_PATH }}
        run: |
          DEST_PATH=$(echo -n "$DEST_PATH_RAW" | tr -d '\r\n ')

          # 1. Package backend archive locally
          tar -czf /tmp/backend-deploy.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='node_modules' \
            --exclude='.env' \
            .

          # 2. Ensure remote directory exists
          echo "Ensuring remote directory exists: ${DEST_PATH}"
          ssh cpanel "mkdir -p ${DEST_PATH}"

          # 3. Securely upload archive
          echo "Uploading backend archive..."
          scp /tmp/backend-deploy.tar.gz cpanel:${DEST_PATH}/backend-deploy.tar.gz

          # 4. Extract archive on server
          echo "Extracting backend archive..."
          ssh cpanel "cd ${DEST_PATH} && tar -xzf backend-deploy.tar.gz && rm -f backend-deploy.tar.gz"

      - name: Install Dependencies & Restart Node App on cPanel
        env:
          DEST_PATH_RAW: ${{ secrets.CPANEL_BACKEND_PATH }}
        run: |
          DEST_PATH=$(echo -n "$DEST_PATH_RAW" | tr -d '\r\n ')

          ssh cpanel "
            cd ${DEST_PATH}
            export PATH=/opt/alt/alt-nodejs20/root/usr/bin:\$PATH
            npm install --omit=dev --no-audit --prefer-offline || npm install --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt
            if command -v pm2 > /dev/null 2>&1; then
              pm2 reload factory-backend || pm2 restart factory-backend || true
            fi
          "
